name: Build challenge

on:
  workflow_dispatch:
    inputs:
      challenge_id:
        description: "Challenge id (e.g. cm-2026-001)"
        required: true
        type: string
  push:
    paths:
      - "challenges/**"
      - "generator/**"
      - "templates/**"
      - ".github/workflows/build-challenge.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      challenges: ${{ steps.set.outputs.challenges }}
    steps:
      - uses: actions/checkout@v6
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'challenges=["${{ inputs.challenge_id }}"]' >> "$GITHUB_OUTPUT"
          else
            mapfile -t ids < <(
              find challenges -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
                | grep -E '^cm-' | sort
            )
            if [ ${#ids[@]} -eq 0 ]; then
              echo 'challenges=[]' >> "$GITHUB_OUTPUT"
            else
              printf -v joined '"%s",' "${ids[@]}"
              echo "challenges=[${joined%,}]" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: discover
    if: needs.discover.outputs.challenges != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        challenge_id: ${{ fromJson(needs.discover.outputs.challenges) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install toolchains
        run: |
          set -euo pipefail
          YML="challenges/${{ matrix.challenge_id }}/challenge.yml"
          ARCH=$(awk '/^arch:/{print $2; exit}' "$YML")
          LANG=$(awk '/^language:/{print $2; exit}' "$YML")
          echo "challenge arch=$ARCH lang=$LANG"

          PKGS=(gcc)
          case "$ARCH" in
            windows-x86)
              # PE32: MinGW 32-bit + wine32 (i386) for verify
              sudo dpkg --add-architecture i386
              sudo apt-get update
              PKGS+=(mingw-w64 wine64 wine32)
              ;;
            windows-x86_64)
              sudo apt-get update
              PKGS+=(mingw-w64 wine64)
              ;;
            linux-*)
              sudo apt-get update
              ;;
            *)
              sudo apt-get update
              PKGS+=(mingw-w64)
              ;;
          esac
          if [ "$LANG" = "asm" ]; then
            PKGS+=(fasm) || true
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "${PKGS[@]}"
          if [ -x third_party/fasm/fasm.x64 ]; then
            echo "$PWD/third_party/fasm" >> "$GITHUB_PATH"
          fi
          if [[ "$ARCH" == windows-* ]]; then
            wine --version || wine64 --version || true
          fi

      - name: Install ptk
        run: |
          python -m pip install -e .

      - name: Build, verify, pack
        env:
          WINEDEBUG: "-all"
        run: |
          ptk all "challenges/${{ matrix.challenge_id }}"

      - name: Upload pack artifact
        uses: actions/upload-artifact@v7
        with:
          name: pack-${{ matrix.challenge_id }}
          path: challenges/${{ matrix.challenge_id }}/dist/*.zip

  catalog:
    needs: build
    if: always() && needs.discover.outputs.challenges != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: ptk catalog
      - uses: actions/upload-artifact@v7
        with:
          name: catalog
          path: |
            catalog/index.json
            site/catalog.json

  release:
    needs: [build, discover]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: pack-${{ inputs.challenge_id }}
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID="${{ inputs.challenge_id }}"
          ZIP=$(ls dist/*.zip | head -n1)
          gh release create "$ID" "$ZIP" \
            --title "$ID" \
            --notes "Public pack for $ID (binary + README). No private sources/solutions included." \
            --latest=false
