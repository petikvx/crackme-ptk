<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>crackme-ptk</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="logo.png" width="56" height="56" alt="crackme-ptk" />
      <div>
        <h1>crackme-ptk</h1>
        <p class="tagline">Crackmes &amp; keygenmes — generate, build, publish via GitHub.</p>
      </div>
    </div>
  </header>

  <section class="filters">
    <label>
      Type
      <select id="filter-type">
        <option value="">all</option>
        <option>crackme</option>
        <option>keygenme</option>
        <option>patchme</option>
        <option>unpackme</option>
      </select>
    </label>
    <label>
      OS
      <select id="filter-os">
        <option value="">all</option>
        <option value="linux">linux</option>
        <option value="windows">windows</option>
      </select>
    </label>
    <label>
      PE
      <select id="filter-pe">
        <option value="">all</option>
        <option value="PE32">PE32</option>
        <option value="PE32+">PE32+</option>
      </select>
    </label>
    <label>
      Language
      <select id="filter-lang">
        <option value="">all</option>
        <option>c</option>
        <option>cpp</option>
        <option>asm</option>
        <option>rust</option>
        <option>go</option>
        <option>python</option>
      </select>
    </label>
    <label>
      Difficulty
      <select id="filter-diff">
        <option value="">all</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
      </select>
    </label>
    <input id="filter-q" type="search" placeholder="Search name / tags…" />
  </section>

  <main>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>OS</th>
          <th>PE</th>
          <th>Lang</th>
          <th>Diff</th>
          <th>Created</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="8">Loading catalog…</td></tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>Public packs contain the binary + README only. Author sources and solutions stay private.</p>
    <p><a href="https://github.com/petikvx/crackme-ptk">Repository</a> · Built with <code>ptk</code></p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
